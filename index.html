<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="scene">

        <!-- القلب -->
        <div id="heartScene">

            <div id="heartText"></div>

            <div class="heartMessage">
                <div class="english">I love you</div>
                <div class="arabic">أنا أحبك</div>
            </div>

        </div>


        <!-- الوردة -->
        <div id="roseScene">

            <div class="rose">

                <div class="flower">

                    <div class="petal petal1"></div>
                    <div class="petal petal2"></div>
                    <div class="petal petal3"></div>
                    <div class="petal petal4"></div>
                    <div class="petal petal5"></div>
                    <div class="petal petal6"></div>
                    <div class="petal petal7"></div>
                    <div class="petal petal8"></div>

                    <div class="flowerCenter"></div>

                </div>

                <div class="stem"></div>

                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>

            </div>


            <div class="roseMessage">

                <div>I love you</div>

                <div>أنا أحبك</div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
